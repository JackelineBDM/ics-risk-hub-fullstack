<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICS Risk Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #001427; color: #d1d5db; }
        .navbar, footer { background: #001427; border-color: #ffcb05 !important; }
        a, .navbar-brand, h1, h2 { color: #ffcb05; }
        .card { background: #001f3f; border: 1px solid #ffcb05; color: #d1d5db; }
        .btn-warning { background: #ffcb05; color: #001427; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark border-bottom border-warning mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">ICS Risk Hub</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="me-3">Hello, {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-sm btn-outline-warning">Log out</button>
                    </form>
                {% else %}
                    <a class="btn btn-sm btn-outline-warning me-2" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-sm btn-warning" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
